name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: tacit

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tacit/go.mod

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tacit/cmd/tacit-app/frontend/package-lock.json

      - name: Build Mac app
        run: make app
